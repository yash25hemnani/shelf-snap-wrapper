<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · ShelfSnap Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <span class="brand-mark"><span class="material-symbols-outlined">shelves</span></span>
        <div>
          <div class="brand-name">ShelfSnap</div>
          <div class="brand-sub">Admin Console</div>
        </div>
      </div>

      <h1 class="headline-sm">Sign in</h1>
      <p class="muted" style="margin: 4px 0 24px">Use the account that has admin access.</p>

      <div class="alert alert-error" id="error" role="alert" hidden>
        <span class="material-symbols-outlined">error</span>
        <span id="error-text"></span>
      </div>

      <form id="login-form" novalidate style="margin-top: 16px">
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" id="submit" type="submit">Sign in</button>
        <div class="divider">or</div>
        <button class="btn btn-outline btn-block" id="google" type="button">
          <span class="material-symbols-outlined">account_circle</span>
          Continue with Google
        </button>
      </form>

      <p class="auth-footnote">Admin access is granted from the server. Signing in alone doesn't give it.</p>
    </div>
  </main>

  <script type="module">
    import {
      signInWithEmailAndPassword,
      signInWithPopup,
      GoogleAuthProvider,
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
    import { auth, waitForUser, isAdmin } from "/admin/js/firebase.js";

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error");
    const errorText = document.getElementById("error-text");
    const buttons = [document.getElementById("submit"), document.getElementById("google")];

    const MESSAGES = {
      "auth/invalid-credential": "Wrong email or password.",
      "auth/invalid-email": "That email address isn't valid.",
      "auth/too-many-requests": "Too many attempts. Wait a moment and try again.",
      "auth/popup-closed-by-user": "The Google window was closed before signing in.",
      "auth/unauthorized-domain": "This domain isn't in Firebase Auth's authorized domains.",
      "auth/network-request-failed": "Network error. Check your connection.",
    };

    function showError(err) {
      errorText.textContent = MESSAGES[err?.code] ?? err?.message ?? "Sign-in failed.";
      errorBox.hidden = false;
    }

    function setBusy(busy) {
      buttons.forEach((btn) => (btn.disabled = busy));
    }

    // Force a fresh token so a claim granted a minute ago is seen now.
    async function routeSignedIn(user) {
      const admin = await isAdmin(user, true);
      location.replace(admin ? "/admin/" : "/admin/not-admin.html");
    }

    async function attempt(signIn) {
      errorBox.hidden = true;
      setBusy(true);
      try {
        const { user } = await signIn();
        await routeSignedIn(user);
      } catch (err) {
        showError(err);
        setBusy(false);
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) {
        showError({ message: "Enter your email and password." });
        return;
      }
      attempt(() => signInWithEmailAndPassword(auth, email, password));
    });

    document.getElementById("google").addEventListener("click", () => {
      attempt(() => signInWithPopup(auth, new GoogleAuthProvider()));
    });

    if (new URLSearchParams(location.search).get("reason") === "rejected") {
      showError({
        message: "You were signed in, but the server rejected your session. Check the server log for "
          + "\"Admin token verification failed\" to see why.",
      });
    }

    // Already signed in from an earlier visit: skip the form.
    const existing = await waitForUser();
    if (existing) await routeSignedIn(existing);
  </script>
</body>
</html>
